<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master4All Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: url("https://wallpapercave.com/wp/wp5410558.jpg") no-repeat center center fixed;
      background-size: cover;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      animation: underline 8s ease-in;
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin-bottom: 20px;
      transition: 0.3s ease;
    }

    .avatar:hover {
      opacity: 0.6;
    }

    h1 {
      font-family: 'Luckiest Guy', cursive;
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .bio {
      font-family: cursive;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .section-title {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.4rem;
      text-decoration: underline;
    }

    ul.skills {
      list-style: none;
      margin: 10px 0;
    }

    ul.skills li {
      margin: 5px 0;
    }

    .links a {
      display: inline-block;
      margin: 10px;
      color: #00ffff;
      text-decoration: underline;
      font-weight: bold;
      transition: 0.6s ease-in-out;
    }

    @keyframes underline{
      0% {display: none;}
      50% {display: none;}
      80% {opacity 0%;}
      100% {opacity: 100%;}
    }
    #roblox, #email{
      color: white;
      width: 150px;
      height: 30px;
      border-radius: 30px;
      background-color: black;
      border-color: black;
      cursor: pointer;
      transition-duration: 0.4s;
    }
    #roblox:hover, #email:hover{
      background-color: white;
      color: black;
      
    }
    @keyframes quote-animation {
      from{opacity: 100%;}
      to {opacity: 0%}
    }
    .quote {
            background-color: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      animation: quote-animation 4s;
    }
    
  </style>
</head>
<body>
  <div class="quote">
    <h1>"Talent without working hard is nothing" <br> -Ronaldo</h1>
  </div>
  <div class="card">
    <a href="https://www.roblox.com/users/3333754299/profile?friendshipSourceType=PlayerSearch" target="_blank">
      <img class="avatar" src="https://i.pinimg.com/736x/38/31/79/38317917f136719457a456daa6edc328.jpg" alt="Profile Image">
    </a>

    <h1>Master4All</h1>
    <p class="bio">
      Hello! I am a beginner scripter and experienced builder in Roblox. I’m part of a team right now and still learning — but always open to the future!
    </p>

    <div class="section-title" style="font-family: 'Luckiest Guy', sans-serif">Skills</div>
    <ul class="skills">
      <li>Pro Building</li>
      <li>Basic Lua Scripting</li>
    </ul>
    <u><h1>Projects</h1></u>

    <div class="section-title" style="font-family: 'Luckiest Guy', sans-serif">Contact</div>
    <div class="links">
      <a href="https://www.roblox.com/users/3333754299/profile?friendshipSourceType=PlayerSearch" target="_blank" ><button style="font-family: 'Luckiest Guy', sans-serif" id='roblox'>Roblox Profile</button></a>
      <a href="mailto:master4allbusiness@protonmail.com" target="_blank"><button id="email" style="font-family: 'Luckiest Guy', sans-serif">Email Me</button></a>
      <!-- Add Discord or other links here if you want -->
    </div>
  </div>
</body>
</html>
<script>
  const quote = document.querySelector('.quote');
    quote.addEventListener('animationend', () => {
      quote.remove(); // Removes the quote from the DOM
    });

</script>
